name: Android build

# Debug build + lint on every push and pull request. Deliberately needs NO repository secrets: the app
# has no API keys and no backend, so a fork can build it as-is. Release signing is the only thing that
# would ever need secrets — see the commented job at the bottom.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # compileSdk 37 is newer than what the runner image ships pre-installed, so fetch it explicitly
      # rather than relying on AGP's auto-download (which needs licences accepted first anyway).
      - name: Install the compile SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Lint
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Lint findings are the useful output when a build fails a review, so keep them either way.
      - name: Upload the lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: warn

# ---------------------------------------------------------------------------------------------------
# RELEASE SIGNING — the only part of this project that would ever need GitHub Secrets.
#
# Nothing above requires a secret. If you later want CI to produce an installable release build, add
# these four repository secrets (Settings → Secrets and variables → Actions):
#
#   KEYSTORE_BASE64      base64 of your .jks file:  base64 -w0 release.jks   (certutil on Windows)
#   KEYSTORE_PASSWORD    the keystore password
#   KEY_ALIAS            the key alias inside it
#   KEY_PASSWORD         that key's password
#
# then uncomment this job and add a matching signingConfig in app/build.gradle.kts that reads them from
# the environment. Publishing to Play would additionally need PLAY_SERVICE_ACCOUNT_JSON.
#
# Keep the keystore file itself backed up somewhere outside the repo. It cannot be regenerated: lose it
# and you can never update the app under the same identity again.
